// src/core/bench.js
var Bench = class {
  constructor(renderer) {
    this.renderer = renderer;
    this.frames = new Float32Array(2e4);
    this.n = 0;
    this.cpu = new Float32Array(2e4);
    this.tags = new Uint8Array(2e4);
    this.recording = false;
    this.marks = {};
    this.peak = { calls: 0, triangles: 0, points: 0 };
    const gl = renderer.getContext();
    this.gl = gl;
    this.timerExt = gl.getExtension("EXT_disjoint_timer_query_webgl2");
    this.gpu = [];
    this.pending = [];
  }
  start() {
    this.recording = true;
    this.n = 0;
    this.marks.start = performance.now();
  }
  mark(name) {
    this.marks[name] = performance.now();
    if (name === "blast") this.marks.programsAtBlast = this.renderer.info.programs.length;
  }
  gpuBegin() {
    if (!this.recording || !this.timerExt) return;
    const q = this.gl.createQuery();
    this.gl.beginQuery(this.timerExt.TIME_ELAPSED_EXT, q);
    this.cur = q;
  }
  gpuEnd() {
    if (!this.cur) return;
    this.gl.endQuery(this.timerExt.TIME_ELAPSED_EXT);
    this.pending.push(this.cur);
    this.cur = null;
    while (this.pending.length) {
      const q = this.pending[0];
      if (!this.gl.getQueryParameter(q, this.gl.QUERY_RESULT_AVAILABLE)) break;
      if (!this.gl.getParameter(this.timerExt.GPU_DISJOINT_EXT)) this.gpu.push(this.gl.getQueryParameter(q, this.gl.QUERY_RESULT) / 1e6);
      this.gl.deleteQuery(q);
      this.pending.shift();
    }
  }
  // blastWin: кадр отрисован в первую секунду часов взрыва (включая самый первый кадр взрыва)
  frame(dtMs, cpuMs, blastWin) {
    if (!this.recording || this.n >= this.frames.length) return;
    this.frames[this.n] = dtMs;
    this.cpu[this.n] = cpuMs;
    this.tags[this.n] = blastWin ? 1 : 0;
    this.n++;
    const r = this.renderer.info.render;
    if (r.calls > this.peak.calls) this.peak.calls = r.calls;
    if (r.triangles > this.peak.triangles) this.peak.triangles = r.triangles;
  }
  report(extra = {}) {
    this.recording = false;
    const pct = (arr, p) => {
      if (!arr.length) return 0;
      const s = Array.from(arr).sort((a, b) => a - b);
      return s[Math.min(s.length - 1, Math.floor(p * s.length))];
    };
    const f = this.frames.subarray(0, this.n), c = this.cpu.subarray(0, this.n);
    let over = 0, overBlast = 0, max = 0, maxBlast = 0, nBlast = 0;
    for (let i = 0; i < this.n; i++) {
      if (f[i] > 33.4) {
        over++;
        if (this.tags[i]) overBlast++;
      }
      if (f[i] > max) max = f[i];
      if (this.tags[i]) {
        nBlast++;
        if (f[i] > maxBlast) maxBlast = f[i];
      }
    }
    const info = this.renderer.info;
    const res = {
      frames: this.n,
      frame_ms: { p50: +pct(f, 0.5).toFixed(2), p95: +pct(f, 0.95).toFixed(2), p99: +pct(f, 0.99).toFixed(2), max: +max.toFixed(2) },
      cpu_ms: { p50: +pct(c, 0.5).toFixed(2), p95: +pct(c, 0.95).toFixed(2), p99: +pct(c, 0.99).toFixed(2) },
      gpu_ms: this.gpu.length ? { p50: +pct(this.gpu, 0.5).toFixed(2), p95: +pct(this.gpu, 0.95).toFixed(2), p99: +pct(this.gpu, 0.99).toFixed(2) } : "нет EXT_disjoint_timer_query",
      frames_over_33ms: over,
      first_blast: { frames: nBlast, frames_over_33ms: overBlast, max_ms: +maxBlast.toFixed(2) },
      programs: { at_blast: this.marks.programsAtBlast, after: info.programs.length, new_during_blast: info.programs.length - (this.marks.programsAtBlast ?? info.programs.length) },
      renderer_info: { peak_calls: this.peak.calls, peak_triangles: this.peak.triangles, geometries: info.memory.geometries, textures: info.memory.textures },
      ...extra
    };
    const ok = nBlast > 0 && res.first_blast.frames_over_33ms === 0 && res.programs.new_during_blast === 0;
    res.verdict = ok ? "OK: на первом взрыве нет кадров > 33 мс и новых шейдеров" : "ВНИМАНИЕ: см. first_blast / programs";
    window.__BENCH__ = res;
    console.log("BENCH " + JSON.stringify(res));
    return res;
  }
};

    app.model.group.visible = vis;
    if (this.bodyU) {
      this.bodyU.uSwell.value = 1 + 0.55 * smooth(T.swell0, T.sep, t);
      this.bodyU.uCrack.value = smooth(T.crack0, T.sep, t);
      this.bodyU.uCrackGlow.value = 25 * smooth(T.crack0, T.crack0 + 6e-6, t);
    }
    this.fragU.uT.value = t;
    for (const s of [this.flashP, this.sparks, this.streaks, this.dust]) s.time = t;
    const shutter = mode === "replay" ? 1 / (60 * slow) : 1 / 90;
    this.streaks.uniforms.uShutter.value = shutter;
    this.sparks.uniforms.uShutter.value = mode === "replay" ? Math.min(1 / 90, shutter * 4) : 1 / 90;
    this.flashP.uniforms.uShutter.value = shutter;
    this.flashP.uniforms.uGain.value = rk0(mode);
    this.decU.uT.value = t;
    const fl = t < T.crack0 ? 0 : smooth(T.crack0, T.sep + 4e-6, t) * Math.exp(-Math.max(0, t - T.sep) / 45e-4);
    const fb = t < T.sep ? 0 : Math.exp(-t / 0.035);
    const rk = mode === "replay" ? 0.2 : 1;
    this.light.position.set(c.x, c.y + 0.15, c.z);
    this.light.intensity = (9e3 * fl + 1500 * fb) * (0.35 + 0.65 * fs) * rk;
    P.flash = (5 * fl + 0.4 * fb) * fs * rk;
    P.flashTint.setRGB(1, 0.86, 0.66);
    P.bloomStrength = 0.05 + 0.3 * fl;
    P.chroma = mode === "live" && !app.safety.reducedMotion ? 0.5 * Math.exp(-t / 0.06) * this.S * fs : 0;
    const R2 = shockRadius(t);
    P.shock.center.copy(c);
    P.shock.radius = R2;
    P.shock.width = 0.1 + 0.08 * R2;
    P.shock.strength = R2 < 20 ? 0.9 * Math.exp(-R2 / 3) * (app.safety.reducedMotion ? 0.3 : 1) : 0;
    this.shell.visible = t > 0 && R2 < 8;
    this.shell.position.copy(c);
    this.shell.scale.setScalar(Math.max(1e-3, R2));
    this.shellU.uStrength.value = (mode === "replay" ? 0.9 : 0.15) * Math.exp(-R2 / 2.5);
    _col.setRGB(40, 20, 7).multiplyScalar(fb + 2 * fl);
    app.smoke.update(t, app.stage.sunDir, c, _col);
    return t < this.duration;
  }
  applyEye(t) {
    const P = this.app.post.params;
    P.adapt = 1 - 0.35 * this.S * Math.exp(-t / 1.2) * smooth(0, 0.05, t);
  }
  shakeAt(t, camPos) {
    const d = camPos.distanceTo(this.startPos);
    const ta = d / 343;
    if (t < ta) return 0;
    return 3.2 / (1 + d * 0.9) * Math.exp(-(t - ta) / 0.3);
  }
};

// src/m67/main.js
async function adaptM67({ renderer, quality }) {
  const m = await buildM67({ renderer, quality, wear: 0.55, rust: 0.35, smudge: 0.5 });
  const P = m.parts;
  const R2 = m.dims.R;
  const leverBase = P.lever.rotation.z;
  const mass = m.dims.mass;
  return {
    group: m.group,
    bodyMesh: m.bodyMesh,
    dims: m.dims,
    body: {
      mass,
      restY: R2 + 4e-3,
      colliders: [{ p: new THREE10.Vector3(0, 0, 0), r: R2 }, { p: new THREE10.Vector3(0, 0.046, 0), r: 0.011 }],
      inertia: inertia.sphere(mass, R2),
      restitution: 0.25,
      rolling: 0.012
    },
    pin: {
      obj: P.pin,
      ringObj: P.ring,
      ringCenter: m.ring.colliders[0].p.clone(),
      anchor: P.pin.position.clone(),
      axis: m.pin.axis.clone(),
      travel: m.pin.travel,
      set: (d) => m.pin.set(d),
      colliders: m.pin.colliders,
      mass: 0.01
    },
    lever: {
      obj: P.lever,
      hinge: m.lever.hinge,
      axis: m.lever.axis,
      kick: 95,
      set(a) {
        P.lever.rotation.z = leverBase + a;
      },
      colliders: m.lever.colliders,
      mass: 0.02
    },
    // clip.set(false) в модели прячет клип — при снятии он становится телом, поэтому только «вернуть»
    clip: { obj: P.clip, set(on) {
      if (on) m.clip.set(true);
    }, colliders: m.clip.colliders, mass: 4e-3, grabCenter: m.clip.colliders[1].p.clone() },
    fuzeVent: m.fuzeVent,
    cutaway: m.cutaway,
    reset() {
      m.reset();
      P.lever.rotation.z = leverBase;
      m.cutaway.burn(0);
    }
  };
}
var SLOW = [[1e-7, 4e4], [35e-6, 4e4], [2e-4, 3e3], [5e-3, 170], [0.08, 17], [1.5, 1]];
var DIST = [[1e-7, 0.3], [3e-5, 0.32], [4e-4, 0.7], [0.02, 1.6], [0.6, 2.6]];
var fmtT = (t) => t < 1e-3 ? `t = ${(t * 1e6).toFixed(1)} мкс` : t < 1 ? `t = ${(t * 1e3).toFixed(2)} мс` : `t = ${t.toFixed(2)} с`;
startApp({
  id: "m67",
  title: "M67 · осколочная граната",
  subtitle: "гладкая сфера Ø63,5 мм · запал M213 · задержка 4–5,5 с · 400 г",
  hint: "ЛКМ — действия и бросок · колесо — зум · Space — следующее действие · R — сброс",
  hasClip: true,
  fuse: [4, 5.5],
  restYaw: 0,
  homeDist: 0.3,
  wideDist: 5.5,
  throwSpin: 14,
  options: [{ type: "switch", key: "cutaway", label: "Разрез запала", value: false }],
  buildModel: adaptM67,
  createBlast: (app) => new M67Blast(app),
  replay: {
    dist: 1.5,
    height: 0.3,
    slowdown: (t) => logInterp(SLOW, t),
    distAt: (t) => logInterp(DIST, t),
    label: fmtT,
    fpsLabel: (s) => `≈ ${Math.round(60 * s).toLocaleString("ru-RU")} к/с`
  }
});
